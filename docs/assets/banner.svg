<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">skill-wiz</title>
  <desc id="desc">skill-wiz — audit agent skill files for what they actually tell the model to do.</desc>

  <defs>
    <linearGradient id="sigilFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b4ff"/>
      <stop offset="1" stop-color="#6f4fd8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#6f4fd8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6f4fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a487ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a487ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#08060d"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- sigil -->
  <g transform="translate(78 100) scale(3.1)">
    <path d="M16 1.6 28.5 8.8v14.4L16 30.4 3.5 23.2V8.8Z" fill="none" stroke="url(#sigilFill)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M16 8.5l1.9 4.4 4.6 1.6-4.6 1.6L16 20.5l-1.9-4.4-4.6-1.6 4.6-1.6Z" fill="url(#sigilFill)"/>
  </g>

  <!-- wordmark -->
  <text x="216" y="163"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="76" font-weight="600" letter-spacing="-1" fill="#ece9f6">skill<tspan fill="#a487ff">-wiz</tspan></text>

  <text x="220" y="205"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" fill="#948cae">Audit agent skills for what they actually tell the model to do</text>

  <!-- severity chips, mirroring the HTML report -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
     font-size="15" letter-spacing="1.6">
    <g transform="translate(958 96)">
      <rect width="164" height="34" rx="8" fill="#191524" stroke="#ff7089" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="4" fill="#ff7089"/>
      <text x="36" y="22" fill="#ff7089">SHELL</text>
    </g>
    <g transform="translate(958 140)">
      <rect width="164" height="34" rx="8" fill="#191524" stroke="#f2b955" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="4" fill="#f2b955"/>
      <text x="36" y="22" fill="#f2b955">MISMATCH</text>
    </g>
    <g transform="translate(958 184)">
      <rect width="164" height="34" rx="8" fill="#191524" stroke="#5fb8f5" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="4" fill="#5fb8f5"/>
      <text x="36" y="22" fill="#5fb8f5">URL</text>
    </g>
  </g>

  <rect y="296" width="1200" height="4" fill="url(#rule)"/>
</svg>
